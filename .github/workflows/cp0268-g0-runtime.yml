name: CP-0268 GitHub-Hosted Scoped G0 Runtime

on:
  workflow_dispatch:
  push:
    branches: [cp-0267-g0-notverified-enforcement]
    paths:
      - '.github/workflows/cp0268-g0-runtime.yml'
      - 'scripts/AISTS_CP0268_GitHub_G0_Runtime.py'
      - 'scripts/AISTS_CP0026_Research_Candidate_Builder.py'
      - 'scripts/AISTS_CP0267_NotVerified_Gate.py'
      - 'scripts/AISTS_CP0165_4H_Monthly_Checksum_Gap_Audit.py'
      - 'evidence/source_adjudication/CP0040_Run_38882377148/CP0040_ExactKey_Quarantine_Manifest.csv'
      - 'evidence/source_adjudication/CP0040_Run_38882377148/CP0040_NonRow_Blockers.csv'
      - 'evidence/source_adjudication/CP0040_Reconstruction_Run_38895499283/CP0040_Baseline_Reconstruction_Archive_Inventory.csv'
      - 'evidence/runs/38725478106_flagged_dates.csv'

permissions:
  contents: read

concurrency:
  group: cp0268-g0-runtime
  cancel-in-progress: false

jobs:
  scoped-g0-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore existing archive cache only
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/aists/binance-monthly-archives
            .cache/aists/binance-daily-references
          key: aists-btcusdt-source-cache-v3-7intervals-2017-08-2026-09
          restore-keys: |
            aists-btcusdt-source-cache-v2-
            aists-btcusdt-monthly-spot-v2-7intervals-2017-08-2026-09
            aists-btcusdt-monthly-spot-v1-2017-08-2026-09
      - name: Compile runtime and gate
        run: >-
          python -m py_compile
          scripts/AISTS_CP0268_GitHub_G0_Runtime.py
          scripts/AISTS_CP0026_Research_Candidate_Builder.py
          scripts/AISTS_CP0267_NotVerified_Gate.py
          scripts/AISTS_CP0165_4H_Monthly_Checksum_Gap_Audit.py
      - name: Execute checksum-verified scoped G0 runtime
        run: python scripts/AISTS_CP0268_GitHub_G0_Runtime.py
      - name: Upload runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp0268-g0-runtime-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            results/cp0165_4h_archive_audit/
            results/cp0268_g0_runtime/
          if-no-files-found: warn
          retention-days: 30

name: CP-0239 Capture Current BTCUSDT Spot Filters

on:
  push:
    branches:
      - cp-0120-ai-brain-foundation
    paths:
      - ".github/workflows/cp0239-capture-spot-filters.yml"
      - "scripts/capture_binance_spot_filters.py"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/cp0239-capture-spot-filters.yml"
      - "scripts/capture_binance_spot_filters.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp0239-spot-filter-capture
  cancel-in-progress: false

jobs:
  capture-current-public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cp-0120-ai-brain-foundation
          persist-credentials: true

      - name: Capture and hash official public Spot metadata
        run: python scripts/capture_binance_spot_filters.py

      - name: Commit immutable timestamped evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/operational_filters/
          if git diff --cached --quiet; then
            echo "No evidence files staged; refusing to report capture as committed."
            exit 1
          fi
          git commit -m "evidence: capture timestamped BTCUSDT Spot filters"
          git push origin HEAD:cp-0120-ai-brain-foundation

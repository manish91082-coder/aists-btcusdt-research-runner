name: HD-04 alternate-source bounded probe

on:
  push:
    branches:
      - research/hd04-alternate-source-probe
    paths:
      - "scripts/probe_hd04_alternate_sources.py"
      - ".github/workflows/hd04-alternate-source-probe.yml"

permissions:
  contents: read

jobs:
  alternate-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile probe
        run: python -m py_compile scripts/probe_hd04_alternate_sources.py
      - name: Run bounded read-only Bybit and OKX probe
        id: probe
        continue-on-error: true
        run: python scripts/probe_hd04_alternate_sources.py
      - name: Preserve point-in-time report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd04-alternate-source-probe-${{ github.run_id }}
          path: artifacts/hd04/hd04-alternate-sources.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report probe result
        if: always()
        run: |
          echo "Probe outcome: ${{ steps.probe.outcome }}"
          test -f artifacts/hd04/hd04-alternate-sources.json

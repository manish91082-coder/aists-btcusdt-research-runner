name: Monthly Binance history chunk audit

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Completed UTC month (YYYY-MM)"
        required: true
        default: "2026-09"
        type: string
      interval:
        description: "Interval for Spot and USD-M Futures"
        required: true
        default: "5m"
        type: choice
        options: ["5m", "15m", "1h", "4h", "8h", "1d"]

permissions:
  contents: read

jobs:
  monthly-archive-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate completed month
        env:
          AUDIT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import os, re
          from datetime import date
          v=os.environ["AUDIT_MONTH"]
          if not re.fullmatch(r"\d{4}-\d{2}",v): raise SystemExit("month must be YYYY-MM")
          y,m=map(int,v.split("-"))
          if not 1<=m<=12 or date(y,m,1).strftime("%Y-%m")!=v: raise SystemExit("invalid month")
          if v>=date.today().strftime("%Y-%m"): raise SystemExit("select a completed month")
          PY
      - name: Audit official monthly Spot archive
        continue-on-error: true
        env:
          AUDIT_MONTH: ${{ inputs.month }}
          AUDIT_INTERVAL: ${{ inputs.interval }}
        run: |
          python tools/audit_binance_monthly_archive.py --market spot --symbol BTCUSDT --interval "$AUDIT_INTERVAL" --month "$AUDIT_MONTH" --require-full-month --out monthly-output
      - name: Audit official monthly USD-M Futures archive
        continue-on-error: true
        env:
          AUDIT_MONTH: ${{ inputs.month }}
          AUDIT_INTERVAL: ${{ inputs.interval }}
        run: |
          python tools/audit_binance_monthly_archive.py --market usdm --symbol BTCUSDT --interval "$AUDIT_INTERVAL" --month "$AUDIT_MONTH" --require-full-month --out monthly-output
      - name: Enforce archive gate
        if: always()
        run: |
          python - <<'PY'
          import glob, json, sys
          files=sorted(glob.glob("monthly-output/*.report.json"))
          if len(files)!=2:
              print(f"Expected 2 reports; found {files}")
              sys.exit(1)
          reports=[json.load(open(f,encoding="utf-8")) for f in files]
          for r in reports: print(r["market"],r["status"],r.get("checks",{}))
          sys.exit(0 if all(r["status"]=="PASS" for r in reports) else 1)
          PY
      - name: Upload reports and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-binance-${{ inputs.month }}-${{ inputs.interval }}-${{ github.run_id }}
          path: monthly-output/
          if-no-files-found: warn
          retention-days: 14

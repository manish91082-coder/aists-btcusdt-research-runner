name: Phase 2 Binance archive audit

on:
  workflow_dispatch:
    inputs:
      archive_date:
        description: "UTC archive date (YYYY-MM-DD), preferably a completed date several days in the past"
        required: true
        default: "2026-10-15"
        type: string
      symbol:
        description: "Representative symbol"
        required: true
        default: "BTCUSDT"
        type: string
      interval:
        description: "Kline interval"
        required: true
        default: "5m"
        type: choice
        options:
          - 5m
          - 15m
          - 1h
          - 4h

permissions:
  contents: read

jobs:
  audit-spot-and-usdm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manual inputs
        shell: bash
        env:
          AUDIT_DATE: ${{ inputs.archive_date || '2026-10-15' }}
          AUDIT_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
          AUDIT_INTERVAL: ${{ inputs.interval || '5m' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from datetime import date

          value = os.environ["AUDIT_DATE"]
          try:
              parsed = date.fromisoformat(value)
          except ValueError as exc:
              raise SystemExit(f"Invalid archive_date {value!r}: expected canonical YYYY-MM-DD") from exc
          if parsed.isoformat() != value:
              raise SystemExit(f"Invalid archive_date {value!r}: expected canonical YYYY-MM-DD")
          symbol = os.environ["AUDIT_SYMBOL"]
          if not re.fullmatch(r"[A-Za-z0-9]+", symbol):
              raise SystemExit("Invalid symbol: use ASCII letters and digits only")
          if os.environ["AUDIT_INTERVAL"] not in {"5m", "15m", "1h", "4h"}:
              raise SystemExit("Invalid interval: choose 5m, 15m, 1h, or 4h")
          print(f"Validated inputs: date={value}, symbol={symbol.upper()}, interval={os.environ['AUDIT_INTERVAL']}")
          PY
      - name: Run official Spot archive audit
        id: spot
        shell: bash
        env:
          AUDIT_DATE: ${{ inputs.archive_date || '2026-10-15' }}
          AUDIT_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
          AUDIT_INTERVAL: ${{ inputs.interval || '5m' }}
        run: |
          set +e
          python tools/audit_binance_archive.py --market spot --symbol "$AUDIT_SYMBOL" --interval "$AUDIT_INTERVAL" --date "$AUDIT_DATE" --api-samples 3 --out audit_output/spot
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run official USDⓈ-M Futures archive audit
        id: usdm
        shell: bash
        env:
          AUDIT_DATE: ${{ inputs.archive_date || '2026-10-15' }}
          AUDIT_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
          AUDIT_INTERVAL: ${{ inputs.interval || '5m' }}
        run: |
          set +e
          python tools/audit_binance_archive.py --market usdm --symbol "$AUDIT_SYMBOL" --interval "$AUDIT_INTERVAL" --date "$AUDIT_DATE" --api-samples 3 --out audit_output/usdm
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Select a date whose monthly archive should be published
        if: always()
        id: cadence_date
        shell: bash
        env:
          AUDIT_DATE: ${{ inputs.archive_date || '2026-10-15' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date, timedelta, timezone
          requested = date.fromisoformat(os.environ["AUDIT_DATE"])
          today = date.today()
          # A monthly archive for the current UTC month may not be published until month-end.
          # Keep the main daily/API audit on its requested date; use a prior completed month
          # only for this separate daily-vs-monthly diagnostic.
          if (requested.year, requested.month) >= (today.year, today.month):
              first = requested.replace(day=1)
              prior_month_last = first - timedelta(days=1)
              day = min(requested.day, prior_month_last.day)
              selected = prior_month_last.replace(day=day)
          else:
              selected = requested
          print(f"date={selected.isoformat()}")
          print(f"requested_date={requested.isoformat()}")
          PY
      - name: Cross-check Spot daily archive against monthly archive (diagnostic only)
        if: always()
        shell: bash
        env:
          AUDIT_DATE: ${{ steps.cadence_date.outputs.date }}
          AUDIT_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
          AUDIT_INTERVAL: ${{ inputs.interval || '5m' }}
        run: |
          set +e
          echo "Diagnostic date (may differ from main audit date): $AUDIT_DATE"
          python tools/compare_binance_archive_cadences.py --market spot --symbol "$AUDIT_SYMBOL" --interval "$AUDIT_INTERVAL" --date "$AUDIT_DATE" --out audit_output/cadence_spot
          rc=$?
          echo "Spot daily-monthly diagnostic exit code: $rc"
          exit 0
      - name: Cross-check USDⓈ-M Futures daily archive against monthly archive (diagnostic only)
        if: always()
        shell: bash
        env:
          AUDIT_DATE: ${{ steps.cadence_date.outputs.date }}
          AUDIT_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
          AUDIT_INTERVAL: ${{ inputs.interval || '5m' }}
        run: |
          set +e
          echo "Diagnostic date (may differ from main audit date): $AUDIT_DATE"
          python tools/compare_binance_archive_cadences.py --market usdm --symbol "$AUDIT_SYMBOL" --interval "$AUDIT_INTERVAL" --date "$AUDIT_DATE" --out audit_output/cadence_usdm
          rc=$?
          echo "USDⓈ-M daily-monthly diagnostic exit code: $rc"
          exit 0
      - name: Upload reports and downloaded audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-binance-audit-${{ inputs.archive_date || '2026-10-15' }}-${{ inputs.symbol || 'BTCUSDT' }}-${{ inputs.interval || '5m' }}
          path: audit_output/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce audit gate
        if: always()
        shell: bash
        env:
          SPOT_EXIT: ${{ steps.spot.outputs.exit_code }}
          USDM_EXIT: ${{ steps.usdm.outputs.exit_code }}
        run: |
          echo "Spot audit exit code: ${SPOT_EXIT:-missing}"
          echo "USDⓈ-M audit exit code: ${USDM_EXIT:-missing}"
          if [ "${SPOT_EXIT:-99}" != "0" ] || [ "${USDM_EXIT:-99}" != "0" ]; then
            echo "Phase 2 audit did not PASS for both markets. Review uploaded JSON reports; do not advance the research gate."
            exit 1
          fi

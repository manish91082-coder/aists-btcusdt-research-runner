name: CP-0120 AI Brain Unit Tests

on:
  push:
    branches:
      - cp-0120-ai-brain-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  brain-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile brain modules
        run: python -m py_compile aists_brain/market_context.py aists_brain/market_regime.py aists_brain/strategy_candidates.py aists_brain/multi_timeframe.py aists_brain/causal_volatility.py aists_brain/multi_timeframe_selector.py aists_brain/historical_replay.py
      - name: Run brain unit tests
        run: python -m unittest discover -s tests -p 'test_market_*.py' -v

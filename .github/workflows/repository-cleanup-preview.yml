name: Repository Cleanup Preview

on:
  push:
    paths:
      - ".github/workflows/repository-cleanup-preview.yml"
      - "scripts/cleanup_current_project.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cleanup script in DRY-RUN mode
        run: |
          set -o pipefail
          python scripts/cleanup_current_project.py 2>&1 | tee cleanup-preview.txt

      - name: Upload cleanup preview
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-preview
          path: cleanup-preview.txt
          if-no-files-found: error
          retention-days: 14

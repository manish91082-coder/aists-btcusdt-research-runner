name: BTCUSDT multi-month history integrity and baseline
on:
  push:
    branches:
      - research/hd04-alternate-source-probe
    paths:
      - ".github/workflows/btcusdt-multimonth-history-integrity.yml"
      - "scripts/acquire_validate_btcusdt_history.py"
      - "scripts/prepare_btcusdt_research_dataset.py"
      - "scripts/backtest_btcusdt_baseline.py"
  workflow_dispatch:
    inputs:
      start_month:
        description: Inclusive UTC month (YYYY-MM)
        required: true
        default: "2026-07"
        type: string
      end_month:
        description: Inclusive UTC month (YYYY-MM)
        required: true
        default: "2026-09"
        type: string
      initial_equity:
        description: Illustrative starting quote-currency equity
        required: true
        default: "1000"
        type: string
      fee_bps:
        description: Illustrative fee per fill in basis points
        required: true
        default: "10"
        type: string
      spread_bps:
        description: Illustrative full spread in basis points
        required: true
        default: "2"
        type: string
      slippage_bps:
        description: Illustrative slippage per fill in basis points
        required: true
        default: "5"
        type: string
permissions:
  contents: read
jobs:
  acquire-validate-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire official monthly archives and validate integrity
        env:
          START_MONTH: ${{ inputs.start_month || '2026-07' }}
          END_MONTH: ${{ inputs.end_month || '2026-09' }}
        run: >-
          python scripts/acquire_validate_btcusdt_history.py
          --start-month "$START_MONTH"
          --end-month "$END_MONTH"
          --output-dir artifacts/hd04-history
      - name: Prepare normalized Spot/Futures dataset and funding events
        env:
          START_MONTH: ${{ inputs.start_month || '2026-07' }}
          END_MONTH: ${{ inputs.end_month || '2026-09' }}
        run: >-
          python scripts/prepare_btcusdt_research_dataset.py
          --start-month "$START_MONTH"
          --end-month "$END_MONTH"
          --input-dir artifacts/hd04-history
          --output-dir artifacts/hd04-normalized
      - name: Run cost-explicit Spot benchmark
        env:
          INITIAL_EQUITY: ${{ inputs.initial_equity || '1000' }}
          FEE_BPS: ${{ inputs.fee_bps || '10' }}
          SPREAD_BPS: ${{ inputs.spread_bps || '2' }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps || '5' }}
        run: >-
          python scripts/backtest_btcusdt_baseline.py
          --input artifacts/hd04-normalized/btc-usdt-5m-aligned.csv
          --output-dir artifacts/hd04-baseline
          --initial-equity "$INITIAL_EQUITY"
          --fee-bps "$FEE_BPS"
          --spread-bps "$SPREAD_BPS"
          --slippage-bps "$SLIPPAGE_BPS"
      - name: Verify baseline report and benchmark outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          report_path = Path("artifacts/hd04-baseline/btc-usdt-baseline-backtest-report.json")
          curve_path = Path("artifacts/hd04-baseline/btc-usdt-baseline-equity-curve.csv")
          if not report_path.is_file() or not curve_path.is_file():
              raise SystemExit("baseline outputs missing")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("status") != "PASS" or report.get("benchmark_only") is not True:
              raise SystemExit("baseline report status/benchmark_only assertion failed")
          benchmarks = report.get("benchmarks", {})
          if not {"flat_no_trade", "spot_buy_and_hold"}.issubset(benchmarks):
              raise SystemExit("required baseline benchmarks missing")
          if benchmarks["flat_no_trade"].get("net_return_pct") != 0.0:
              raise SystemExit("flat/no-trade benchmark should return exactly zero")
          if report.get("input_rows") != 26496:
              raise SystemExit(f"expected 26496 aligned 5m rows for Jul-Sep 2026; got {report.get('input_rows')}")
          with curve_path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 26496:
              raise SystemExit(f"equity curve row count mismatch: {len(rows)}")
          print(json.dumps({
              "baseline_verification": "PASS",
              "input_rows": report["input_rows"],
              "equity_curve_rows": len(rows),
              "benchmarks": sorted(benchmarks),
              "net_return_pct": benchmarks["spot_buy_and_hold"]["net_return_pct"],
              "warning": "benchmark only; does not establish a trading edge"
          }, indent=2))
          PY
      - name: Upload raw archives, normalized dataset, baseline, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-multimonth-research-and-baseline
          path: |
            artifacts/hd04-history/
            artifacts/hd04-normalized/
            artifacts/hd04-baseline/
          if-no-files-found: warn
          retention-days: 30

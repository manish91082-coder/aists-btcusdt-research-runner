name: ⏰ Scheduled Research Runner

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if no changes'
        required: false
        default: 'true'
  schedule:
    - cron: '0 0 * * *'    # Daily midnight UTC
    - cron: '0 6 * * *'    # Daily 6am UTC
    - cron: '0 12 * * *'   # Daily noon UTC
    - cron: '0 18 * * *'   # Daily 6pm UTC

permissions:
  contents: write
  actions: write
  checks: write
  issues: write
  pages: write
  pull-requests: write
  statuses: write

jobs:
  scheduled-research:
    name: 🕐 Scheduled BTCUSDT Research
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          pip install requests pandas numpy ta ccxt

      - name: 📁 Create Directories
        run: mkdir -p results/scheduled

      - name: 🔄 Run Scheduled Research
        run: |
          python << 'EOF'
          import requests, json, datetime, os
          import pandas as pd

          now = datetime.datetime.utcnow()
          print(f"⏰ Scheduled run at: {now.isoformat()}")

          # Fetch current BTCUSDT price
          ticker_url = "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT"
          resp = requests.get(ticker_url, timeout=15)
          ticker = resp.json()

          data = {
            "timestamp": now.isoformat(),
            "symbol": "BTCUSDT",
            "price": float(ticker["lastPrice"]),
            "change_24h_pct": float(ticker["priceChangePercent"]),
            "high_24h": float(ticker["highPrice"]),
            "low_24h": float(ticker["lowPrice"]),
            "volume_24h": float(ticker["volume"]),
            "quote_volume_24h": float(ticker["quoteVolume"]),
            "trades_24h": int(ticker["count"])
          }

          filename = f"results/scheduled/snapshot_{now.strftime('%Y%m%d_%H%M%S')}.json"
          with open(filename, "w") as f:
              json.dump(data, f, indent=2)

          with open("results/scheduled/latest.json", "w") as f:
              json.dump(data, f, indent=2)

          print(f"✅ Snapshot saved: {filename}")
          print(json.dumps(data, indent=2))
          EOF

      - name: 📤 Upload Scheduled Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-snapshot-${{ github.run_number }}
          path: results/scheduled/
          retention-days: 90

      - name: 📝 Summary
        run: |
          echo "## ⏰ Scheduled Snapshot #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat results/scheduled/latest.json
          echo '```' >> $GITHUB_STEP_SUMMARY

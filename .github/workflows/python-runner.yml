name: AISTS Research Runner

on:
  push:
    branches: [main]
    paths:
      - 'requests/**'
  workflow_dispatch:
    inputs:
      task:
        description: 'Allowlisted task'
        required: true
        type: choice
        options:
          - smoke
        default: smoke

permissions:
  contents: read

concurrency:
  group: aists-research-runner
  cancel-in-progress: false

jobs:
  run:
    name: Execute allowlisted research task
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare request for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          TASK_INPUT: ${{ inputs.task }}
          RUN_ID_INPUT: ${{ github.run_id }}
          COMMIT_SHA_INPUT: ${{ github.sha }}
        run: |
          mkdir -p requests
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          request = {
              "request_id": "MANUAL-" + os.environ["RUN_ID_INPUT"],
              "task": os.environ["TASK_INPUT"],
              "purpose": "Manual allowlisted runner verification",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "requested_commit_sha": os.environ["COMMIT_SHA_INPUT"]
          }
          with open("requests/current.json", "w", encoding="utf-8") as f:
              json.dump(request, f, indent=2)
              f.write("\\n")
          PY

      - name: Execute task and generate evidence
        env:
          AISTS_RUN_ID: ${{ github.run_id }}
          AISTS_RUN_ATTEMPT: ${{ github.run_attempt }}
          AISTS_COMMIT_SHA: ${{ github.sha }}
          AISTS_REF: ${{ github.ref }}
          AISTS_EVENT: ${{ github.event_name }}
        run: python scripts/aists_runner.py --request requests/current.json --output-dir results

      - name: Upload compact evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aists-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish job summary
        if: always()
        run: |
          echo "# AISTS Research Runner" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/run_summary.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Evidence summary JSON is included below and in the artifact." >> "$GITHUB_STEP_SUMMARY"
            cat results/run_summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No run_summary.json generated." >> "$GITHUB_STEP_SUMMARY"
          fi

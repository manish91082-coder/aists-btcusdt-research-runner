  publish_cp0040_quarantine_sensitivity_audit:
    if: needs.run.result == 'success' && needs.run.outputs.task == 'cp0040_quarantine_sensitivity_run'
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout main with scoped write token
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: true
      - name: Download this run's sensitivity artifact
        uses: actions/download-artifact@v4
        with:
          name: aists-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evidence_stage
      - name: Validate bounded sensitivity evidence before publication
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root = Path("evidence_stage/cp0040_quarantine_sensitivity_audit")
          summary_path = root / "CP0040_Quarantine_Sensitivity_Audit_Summary.json"
          report_path = root / "CP0040_Quarantine_Sensitivity_Audit_Report_HI.md"
          if not summary_path.is_file() or not report_path.is_file():
              raise SystemExit("Required sensitivity summary/report missing; refusing evidence publish")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          allowed = {"PASS_QUARANTINE_SENSITIVITY_DIAGNOSTIC_COMPLETE", "BLOCKED_BASELINE_METRICS_NOT_REPRODUCIBLE"}
          if summary.get("task") != "cp0040_quarantine_sensitivity_run" or summary.get("status") not in allowed:
              raise SystemExit("Unexpected task/status or an early/unverified blocker; refusing evidence publish")
          if summary.get("network_used") is not False or summary.get("market_data_downloads") != 0:
              raise SystemExit("Network or market-data acquisition assertion failed")
          if summary.get("production_candidate_build") is not False or summary.get("strategy_promoted") is not False:
              raise SystemExit("Production-build/promotion restriction failed")
          anchors = summary.get("anchors", summary.get("gate", {}))
          if anchors.get("manifest_sha256") != "e5cd62a67685b4ff1bc32c2434b5e373fe2dd76d74e2424b67a4cc5aee7c720a":
              raise SystemExit("Published result is not bound to the frozen CP-0040 exact-key manifest")
          if anchors.get("blockers_sha256") != "f45431edcaf657404b9f5405b239f25cd7761af21e9e8115cd71002f7be1bf36":
              raise SystemExit("Published result is not bound to the frozen 11-row blocker ledger")
          if summary.get("unresolved_nonrow_aggregation_blockers") != 11 or summary.get("g0") != "BLOCKED_GLOBAL" or summary.get("canonical_source") != "NONE":
              raise SystemExit("The 11-blocker/G0/source-authority gates were not preserved")
          if summary.get("status") == "PASS_QUARANTINE_SENSITIVITY_DIAGNOSTIC_COMPLETE":
              if summary.get("baseline_metric_gate") != "PASS" or summary.get("quarantine_sensitivity_run") is not True:
                  raise SystemExit("Quarantine metrics lack a passing baseline gate")
              checks = summary.get("checks", [])
              if not checks or any(x.get("status") != "PASS" for x in checks):
                  raise SystemExit("Successful sensitivity summary contains non-PASS checks")
              if len(summary.get("input_impact", [])) != 3 or len(summary.get("signal_impact", [])) < 1 or len(summary.get("trade_impact", [])) != 3:
                  raise SystemExit("Sensitivity output row count/schema is incomplete")
              required_files = (
                  "CP0040_Quarantine_Performance.csv",
                  "CP0040_Quarantine_Signal_Impact.csv",
                  "CP0040_Quarantine_Trade_Impact.csv",
                  "CP0040_Quarantine_Key_Application.csv",
                  "CP0040_Input_Impact.csv",
              )
              for name in required_files:
                  p = root / name
                  if not p.is_file():
                      raise SystemExit("Missing required diagnostic output: " + name)
              with (root / "CP0040_Quarantine_Performance.csv").open("r",encoding="utf-8",newline="") as f:
                  rows=list(csv.DictReader(f))
              if len(rows) != 3 or {x.get("period") for x in rows} != {"TRAIN","DEVELOPMENT_CHECK","CONSUMED_OOS_DIAGNOSTIC"}:

          root = Path("evidence_stage/cp0040_baseline_reconstruction_audit")
          summary_path = root / "CP0040_Baseline_Reconstruction_Audit_Summary.json"
          report_path = root / "CP0040_Baseline_Reconstruction_Audit_Report_HI.md"
          if not summary_path.is_file() or not report_path.is_file():
              raise SystemExit("Required reconstruction summary/report missing; refusing evidence publish")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          allowed = {"PASS_BASELINE_INPUTS_RECONSTRUCTED", "BLOCKED_INPUTS_NOT_REPRODUCIBLE"}
          if summary.get("task") != "cp0040_baseline_reconstruction_audit" or summary.get("status") not in allowed:
              raise SystemExit("Unexpected task/status; refusing evidence publish")
          if summary.get("network_used") is not False or summary.get("production_candidate_build") is not False or summary.get("backtest_run") is not False:
              raise SystemExit("Scope assertions failed; refusing evidence publish")
          if summary.get("status") == "PASS_BASELINE_INPUTS_RECONSTRUCTED":
              checks = summary.get("checks", [])
              if not checks or any(x.get("status") != "PASS" for x in checks):
                  raise SystemExit("Successful reconstruction summary contains non-PASS checks")
              required = {"4h", "1d", "1mo"}
              results = summary.get("candidate_content_results", {})
              if set(results) != required or any(results[k].get("matches_frozen_content_anchor") is not True for k in required):
                  raise SystemExit("Frozen content anchors do not all match")
          run_id = os.environ["RUN_ID"]
          print(json.dumps({"status":"PASS_PUBLISH_PREFLIGHT","run_id":run_id,"research_status":summary["status"],"checks":len(summary.get("checks",[]))},sort_keys=True))
          PY
      - name: Persist run-scoped evidence and append canonical state
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_COMMIT: ${{ github.sha }}

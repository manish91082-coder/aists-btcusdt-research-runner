name: AISTS Research Runner

on:
  push:
    branches: [main]
    paths:
      - 'requests/**'
  workflow_dispatch:
    inputs:
      task:
        description: 'Allowlisted task'
        required: true
        type: choice
        options:
          - smoke
          - cp0040_quarantine_gate_tests
          - cp0040_quarantine_manifest_build
          - cp0040_quarantine_manifest_extend_acquisition
          - cp0040_quarantine_manifest_extend_aggregation
          - cp0040_candidate_builder_gate_tests
          - cp0040_baseline_reconstruction_audit
          - cp0040_quarantine_sensitivity_run
          - cp0040_aggregation_monthly_sidecar_audit
          - cp0040_archive_integrity_conflict_matrix
          - cp0040_candidate_input_relevance_audit
          - cp0107_shared52_candidate_input_dependency_audit
          - historical_reference_replay
          - monthly_derived_replay
          - legacy_pipeline
          - source_adjudication_diagnostic
          - cp0107_feb2018_raw_row_extract
          - cp0107_feb2018_disposition_overlay
          - cp0107_dec2020_child_window_audit
          - cp0107_field_review_hash_audit
          - cp0107_monthly_checksum_provenance_audit
          - cp0107_cp0041_daily_reference_acquisition_audit
          - cp0107_cp0041_aggregation_bucket_overlay_audit
          - cp0107_cp0041_worklist_disposition_patch_audit
          - cp0107_cp0041_dec2020_residual7_exact_key_audit
          - cp0107_official_update_package_audit
        default: legacy_pipeline

permissions:
  contents: read

concurrency:
  group: aists-research-runner
  cancel-in-progress: false

jobs:
  run:
    outputs:
      task: ${{ steps.request_meta.outputs.task }}
    name: AISTS allowlisted task runner (task-specific result in run summary)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore monthly archive cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/aists/binance-monthly-archives
            .cache/aists/binance-daily-references
          key: aists-btcusdt-source-cache-v3-7intervals-2017-08-2026-09
          save-always: true
          restore-keys: |
            aists-btcusdt-source-cache-v2-
            aists-btcusdt-monthly-spot-v2-7intervals-2017-08-2026-09
            aists-btcusdt-monthly-spot-v1-2017-08-2026-09
      - name: Prepare request for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          TASK_INPUT: ${{ inputs.task }}
          RUN_ID_INPUT: ${{ github.run_id }}
          COMMIT_SHA_INPUT: ${{ github.sha }}
        run: |
          mkdir -p requests
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          request = {
              "request_id": "MANUAL-" + os.environ["RUN_ID_INPUT"],
              "task": os.environ["TASK_INPUT"],
              "purpose": "Manual allowlisted AISTS research execution",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "requested_commit_sha": os.environ["COMMIT_SHA_INPUT"]
          }
          with open("requests/current.json", "w", encoding="utf-8") as f:
              json.dump(request, f, indent=2)
              f.write("\n")
          PY
      - name: Read task for scoped evidence publishing
        id: request_meta
        run: |
          TASK=$(python -c 'import json; print(json.load(open("requests/current.json", encoding="utf-8")).get("task", ""))')
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
      - name: Reuse prior verified daily ZIP and checksum bytes (no repeat download)
        if: steps.request_meta.outputs.task == 'cp0107_cp0041_daily_reference_acquisition_audit'
        uses: actions/download-artifact@v4
        with:
          name: aists-run-38775174019-attempt-1
          run-id: 38775174019
          github-token: ${{ github.token }}
          path: prior_daily_ref
      - name: Install pinned backtest dependencies only when task needs them
        run: |
          TASK=$(python -c 'import json; print(json.load(open("requests/current.json", encoding="utf-8")).get("task", ""))')
          if [ "$TASK" = "cp0040_quarantine_sensitivity_preflight" ] || [ "$TASK" = "cp0040_quarantine_gate_tests" ] || [ "$TASK" = "cp0040_quarantine_manifest_build" ] || [ "$TASK" = "cp0040_quarantine_manifest_extend_acquisition" ] || [ "$TASK" = "cp0040_quarantine_manifest_extend_aggregation" ] || [ "$TASK" = "cp0040_candidate_builder_gate_tests" ] || [ "$TASK" = "cp0040_baseline_reconstruction_audit" ] || [ "$TASK" = "cp0040_aggregation_monthly_sidecar_audit" ] || [ "$TASK" = "cp0040_archive_integrity_conflict_matrix" ] || [ "$TASK" = "cp0040_candidate_input_relevance_audit" ] || [ "$TASK" = "cp0107_shared52_candidate_input_dependency_audit" ] || [ "$TASK" = "cp0107_feb2018_raw_row_extract" ] || [ "$TASK" = "cp0107_feb2018_disposition_overlay" ] || [ "$TASK" = "cp0107_dec2020_child_window_audit" ] || [ "$TASK" = "cp0107_field_review_hash_audit" ] || [ "$TASK" = "cp0107_monthly_checksum_provenance_audit" ] || [ "$TASK" = "cp0107_cp0041_daily_reference_acquisition_audit" ] || [ "$TASK" = "cp0107_cp0041_aggregation_bucket_overlay_audit" ] || [ "$TASK" = "cp0107_cp0041_worklist_disposition_patch_audit" ] || [ "$TASK" = "cp0107_cp0041_dec2020_residual7_exact_key_audit" ] || [ "$TASK" = "cp0107_official_update_package_audit" ]; then
            echo "CP-0040 provenance/crosswalk and CP-0107 cache-only audits use Python standard library; skipping pip dependencies."
          else
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi
      - name: Execute task
        env:
          AISTS_RUN_ID: ${{ github.run_id }}
          AISTS_RUN_ATTEMPT: ${{ github.run_attempt }}
          AISTS_COMMIT_SHA: ${{ github.sha }}
          AISTS_REF: ${{ github.ref }}
          AISTS_EVENT: ${{ github.event_name }}
        run: python scripts/aists_runner.py --request requests/current.json --output-dir results
      - name: Upload compact evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aists-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish run summary
        if: always()
        run: |
          echo "# AISTS Research Runner" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/run_summary.json ]; then
            cat results/run_summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results/run_summary.json generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish_cp0107_evidence:
    if: needs.run.result == 'success' && (needs.run.outputs.task == 'cp0107_feb2018_raw_row_extract' || needs.run.outputs.task == 'cp0107_feb2018_disposition_overlay' || needs.run.outputs.task == 'cp0107_dec2020_child_window_audit' || needs.run.outputs.task == 'cp0107_field_review_hash_audit' || needs.run.outputs.task == 'cp0107_monthly_checksum_provenance_audit' || needs.run.outputs.task == 'cp0107_cp0041_daily_reference_acquisition_audit' || needs.run.outputs.task == 'cp0107_cp0041_aggregation_bucket_overlay_audit' || needs.run.outputs.task == 'cp0107_cp0041_worklist_disposition_patch_audit' || needs.run.outputs.task == 'cp0107_cp0041_dec2020_residual7_exact_key_audit' || needs.run.outputs.task == 'cp0107_official_update_package_audit')
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact main commit with scoped write token
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: true
      - name: Download this run's evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: aists-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evidence_stage
      - name: Validate output hashes and row counts before publishing
        env:
          RUN_ID: ${{ github.run_id }}
          TASK: ${{ needs.run.outputs.task }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root = Path("evidence_stage")
          folder = root / "cp0107_feb2018"
          summary_path = folder / "CP0107_Feb2018_Extraction_Summary.json"
          if not summary_path.is_file():
              raise SystemExit("Missing CP-0107 extraction summary; refusing repository write")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if summary.get("status") != "PASS_CACHE_ONLY_EXTRACTION":
              raise SystemExit("CP-0107 extraction did not PASS; refusing repository write")
          if summary.get("source_objects_verified") != 16 or summary.get("source_objects_expected") != 16:
              raise SystemExit("Expected 16/16 verified source objects; refusing repository write")
          if summary.get("scope", {}).get("off_grid_rows_extracted") != 450:
              raise SystemExit("Expected exactly 450 extracted off-grid rows; refusing repository write")
          if summary.get("checks_passed") != summary.get("checks_total"):
              raise SystemExit("Extraction checks are not all PASS; refusing repository write")
          for name, recorded in summary.get("outputs", {}).items():
              path = folder / name
              if not path.is_file():
                  raise SystemExit(f"Missing expected output: {name}")
              h = hashlib.sha256(path.read_bytes()).hexdigest()
              if h != recorded.get("sha256") or path.stat().st_size != recorded.get("bytes"):
                  raise SystemExit(f"Output hash/size mismatch: {name}")
          def rows(name):
              with (folder / name).open("r", encoding="utf-8", newline="") as f:
                  return list(csv.DictReader(f))
          offgrid = rows("CP0107_Feb2018_OffGrid_RawRows.csv")
          daily = rows("CP0107_Feb2018_DailyCoverage_RawRows.csv")
          source = rows("CP0107_Feb2018_SourceVerification.csv")
          segments = rows("CP0107_Feb2018_SegmentCoverage.csv")
          overlay_path = folder / "CP0107_Feb2018_Disposition_Overlay.csv"
          overlay_summary_path = folder / "CP0107_Feb2018_Disposition_Overlay_Summary.json"
          if overlay_path.is_file() or overlay_summary_path.is_file():
              if not overlay_path.is_file() or not overlay_summary_path.is_file():
                  raise SystemExit("Incomplete disposition overlay pair; refusing repository write")
              overlay = rows("CP0107_Feb2018_Disposition_Overlay.csv")
              overlay_summary = json.loads(overlay_summary_path.read_text(encoding="utf-8"))
              if len(overlay) != 450 or overlay_summary.get("row_count") != 450:
                  raise SystemExit(f"Expected 450 overlay rows; got {len(overlay)}")
              if any(x.get("disposition") != "QUARANTINE_REVIEW_REQUIRED" for x in overlay):
                  raise SystemExit("Overlay contains an unexpected disposition")
              if any(x.get("cp0041_crosswalk_match") != "PASS_FROM_VERIFIED_CROSSWALK" for x in overlay):
                  raise SystemExit("Overlay row lacks CP-0041 crosswalk evidence tag")
              mapped = sum(x.get("mapped_daily_row_status") in ("PRESENT_FIELDS_DIFFER", "PRESENT_NON_OPEN_FIELDS_MATCH") for x in overlay)
              absent = sum(x.get("mapped_daily_row_status") == "ABSENT_REVIEW_REQUIRED" for x in overlay)
              differing = sum(x.get("mapped_daily_economic_or_close_time_differs") == "True" for x in overlay)
              open_differing = sum("open" in x.get("mapped_daily_differing_fields", "").split(";") for x in overlay)
              if mapped != 448 or absent != 2 or differing != 448 or open_differing != 442:
                  raise SystemExit(f"Unexpected mapped/difference counts: present={mapped} absent={absent} differing={differing} open_differing={open_differing}")
              digest = hashlib.sha256(overlay_path.read_bytes()).hexdigest()
              if digest != overlay_summary.get("csv_sha256"):
                  raise SystemExit("Disposition overlay SHA-256 mismatch")
          child_summary_path = folder / "CP0107_Dec2020_ChildWindow_Audit_Summary.json"
          if child_summary_path.is_file():
              child_summary = json.loads(child_summary_path.read_text(encoding="utf-8"))
              if child_summary.get("status") != "PASS_CACHE_ONLY_DEC2020_CHILD_AUDIT":
                  raise SystemExit("December child audit status not PASS")
              if child_summary.get("source_archives_verified") != 2 or child_summary.get("review_rollups_checked") != 9:
                  raise SystemExit("December child audit archive/rollup count mismatch")
              for name, recorded in child_summary.get("outputs", {}).items():
                  path = folder / name
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != recorded.get("sha256") or path.stat().st_size != recorded.get("bytes"):
                      raise SystemExit("December output hash/size mismatch: " + name)
              if len(rows("CP0107_Dec2020_5m_ChildCoverage.csv")) != 60 or len(rows("CP0107_Dec2020_ReviewRollup_ChildCoverage.csv")) != 9 or len(rows("CP0107_Dec2020_5m_SourceVerification.csv")) != 2:
                  raise SystemExit("December child audit CSV row-count mismatch")
          field_summary_path = folder / "CP0107_Dec2020_FieldReview_Summary.json"
          if os.environ.get("TASK") == "cp0107_field_review_hash_audit" and not field_summary_path.is_file():
              raise SystemExit("Missing field-review hash summary; refusing repository write")
          if field_summary_path.is_file():
              field_summary = json.loads(field_summary_path.read_text(encoding="utf-8"))
              if field_summary.get("status") != "PASS_FIELD_REVIEW_HASH_RECOMPUTED":
                  raise SystemExit("Field-review hash verification did not PASS")
              checks = field_summary.get("checks", [])
              if not checks or any(c.get("status") != "PASS" for c in checks):
                  raise SystemExit("Field-review audit contains failed checks")
              expected_rows = {
                  "CP0107_Dec2020_Shared_5m_RawField_Comparison.csv": 16,
                  "CP0107_Dec2020_CloseTime_Fingerprint_FieldReview.csv": 8,
                  "CP0107_Dec2020_Missing_5m_ChildKeys_BySource.csv": 24,
              }
              outputs = field_summary.get("outputs", {})
              if set(outputs) != set(expected_rows):
                  raise SystemExit("Field-review output manifest is incomplete")
              for name, nrows in expected_rows.items():
                  path = folder / name
                  recorded = outputs[name]
                  if not path.is_file():
                      raise SystemExit("Missing field-review CSV: " + name)
                  if hashlib.sha256(path.read_bytes()).hexdigest() != recorded.get("sha256"):
                      raise SystemExit("Field-review CSV SHA-256 mismatch: " + name)
                  if path.stat().st_size != recorded.get("bytes") or len(rows(name)) != nrows or recorded.get("rows") != nrows:
                      raise SystemExit("Field-review byte/row-count mismatch: " + name)
          sidecar_summary_path = folder / "CP0107_Monthly_Checksum_Provenance_Summary.json"
          if os.environ.get("TASK") == "cp0107_monthly_checksum_provenance_audit" and not sidecar_summary_path.is_file():
              raise SystemExit("Missing official checksum provenance summary; refusing repository write")
          if sidecar_summary_path.is_file():
              side_summary = json.loads(sidecar_summary_path.read_text(encoding="utf-8"))
              if side_summary.get("status") != "PASS_OFFICIAL_SIDECAR_PROVENANCE":
                  raise SystemExit("Official checksum sidecar audit did not PASS")
              if side_summary.get("checks_passed") != side_summary.get("checks_total") or side_summary.get("source_count") != 2:
                  raise SystemExit("Official checksum sidecar check count/source count mismatch")
              if any(x.get("fetch_status") != "PASS" for x in side_summary.get("sources", [])) or len(side_summary.get("sources", [])) != 2:
                  raise SystemExit("A checksum source record is not PASS")
              for name, recorded in side_summary.get("outputs", {}).items():
                  path = folder / name
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != recorded.get("sha256") or path.stat().st_size != recorded.get("bytes"):
                      raise SystemExit("Sidecar audit output hash/size mismatch: " + name)
              if len(side_summary.get("checks", [])) < 5 or any(x.get("status") != "PASS" for x in side_summary.get("checks", [])):
                  raise SystemExit("Sidecar audit checks contain a failure")
          acquisition_summary_path = folder / "CP0107_CP0041_DailyReference_Acquisition_Summary.json"
          if os.environ.get("TASK") == "cp0107_cp0041_daily_reference_acquisition_audit" and not acquisition_summary_path.is_file():
              raise SystemExit("Missing CP-0041 daily-reference acquisition summary; refusing repository write")
          if acquisition_summary_path.is_file():
              acquisition = json.loads(acquisition_summary_path.read_text(encoding="utf-8"))
              if acquisition.get("status") != "PASS_DAILY_REFERENCE_ACQUIRED_AND_ROW_AUDIT_RECORDED":
                  raise SystemExit("CP-0041 daily-reference acquisition status not PASS")
              if acquisition.get("queue_count") != 16 or acquisition.get("daily_archive_count") != 16 or acquisition.get("daily_sidecar_count") != 16:
                  raise SystemExit("Expected exactly 16 daily ZIPs and 16 sidecars")
              if acquisition.get("monthly_archive_count") != 14:
                  raise SystemExit("Expected exactly 14 cached monthly ZIPs")
              if acquisition.get("checks_passed") != acquisition.get("checks_total"):
                  raise SystemExit("Daily-reference evidence checks are not all PASS")
              if len(acquisition.get("sources", [])) != 16 or any(x.get("fetch_status") != "PASS" for x in acquisition.get("sources", [])):
                  raise SystemExit("One or more daily reference archive/sidecar records did not PASS")
              if len(acquisition.get("monthly_sources", [])) != 14 or any(x.get("status") != "PASS" for x in acquisition.get("monthly_sources", [])):
                  raise SystemExit("One or more cached monthly source records did not PASS")
              checks = acquisition.get("checks", [])
              if not checks or any(x.get("status") != "PASS" for x in checks):
                  raise SystemExit("Acquisition check register contains a failure")
              for name, recorded in acquisition.get("outputs", {}).items():
                  path = folder / name
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != recorded.get("sha256") or path.stat().st_size != recorded.get("bytes"):
                      raise SystemExit("Acquisition output hash/size mismatch: " + name)
                  if recorded.get("rows") is not None and len(rows(name)) != recorded.get("rows"):
                      raise SystemExit("Acquisition output row-count mismatch: " + name)
              if len(rows("CP0107_CP0041_DailyReference_Queue_Snapshot.csv")) != 16:
                  raise SystemExit("Queue snapshot must preserve all 16 requests")
              if len(rows("CP0107_CP0041_MonthlyArchive_Manifest_Subset.csv")) != 14:
                  raise SystemExit("Monthly archive manifest subset must include 14 records")
              if len(rows("CP0107_CP0041_DailyReference_Period_Summary.csv")) != 16:
                  raise SystemExit("Period summary must include all 16 requested archives")
              if len(rows("CP0107_CP0041_DailyReference_Archive_Manifest.csv")) != 16:
                  raise SystemExit("Acquired archive manifest must include all 16 daily ZIPs")
          aggregation_summary_path = folder / "CP0107_CP0041_AggregationBucket_Summary.json"
          if os.environ.get("TASK") == "cp0107_cp0041_aggregation_bucket_overlay_audit" and not aggregation_summary_path.is_file():
              raise SystemExit("Missing CP-0041 aggregation-bucket overlay summary; refusing repository write")
          if aggregation_summary_path.is_file():
              aggregation = json.loads(aggregation_summary_path.read_text(encoding="utf-8"))
              if aggregation.get("status") != "PASS_AGGREGATION_BUCKET_DAILY_SOURCE_REVIEW":
                  raise SystemExit("Aggregation-bucket audit status not PASS")
              if aggregation.get("bucket_count") != 11 or aggregation.get("row_evidence_count") != 78:
                  raise SystemExit("Expected exactly 11 buckets and 78 source-row evidence links")
              if aggregation.get("checks_passed") != aggregation.get("checks_total") or not aggregation.get("checks"):
                  raise SystemExit("Aggregation-bucket input checks are not all PASS")
              if any(c.get("status") != "PASS" for c in aggregation["checks"]):
                  raise SystemExit("Aggregation-bucket audit check register contains failure")
              decisions = aggregation.get("decisions", {})
              if decisions.get("all_buckets_remain_unresolved") is not True or decisions.get("canonical_source_selected") is not False or decisions.get("source_cases_closed") != 0:
                  raise SystemExit("Aggregation-bucket audit attempted source selection/closure")
              if decisions.get("raw_archives_modified") is not False or decisions.get("timestamps_shifted_or_rounded") is not False or decisions.get("rows_merged_replaced_or_deleted") is not False or decisions.get("synthetic_candles_created") is not False or decisions.get("backtest_rerun") is not False or decisions.get("strategy_promoted") is not False:
                  raise SystemExit("Aggregation-bucket audit violated a frozen safety constraint")
              expected_output_rows = {
                  "CP0107_CP0041_AggregationBucket_Comparison.csv": 11,
                  "CP0107_CP0041_AggregationBucket_RowEvidence.csv": 78,
              }
              outputs = aggregation.get("outputs", {})
              if not all(name in outputs for name in expected_output_rows) or "CP0107_CP0041_AggregationBucket_Report_HI.md" not in outputs:
                  raise SystemExit("Aggregation-bucket output manifest incomplete")
              for name, expected_rows in expected_output_rows.items():
                  p = folder / name
                  rec = outputs[name]
                  if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != rec.get("sha256") or p.stat().st_size != rec.get("bytes"):
                      raise SystemExit("Aggregation-bucket output hash/size mismatch: " + name)
                  if len(rows(name)) != expected_rows or rec.get("rows") != expected_rows:
                      raise SystemExit("Aggregation-bucket output row-count mismatch: " + name)
              report_path = folder / "CP0107_CP0041_AggregationBucket_Report_HI.md"
              rec = outputs["CP0107_CP0041_AggregationBucket_Report_HI.md"]
              if not report_path.is_file() or hashlib.sha256(report_path.read_bytes()).hexdigest() != rec.get("sha256") or report_path.stat().st_size != rec.get("bytes"):
                  raise SystemExit("Aggregation-bucket report hash/size mismatch")
          delta_summary_path = folder / "CP0107_CP0041_Worklist_Disposition_Delta_Summary.json"
          if os.environ.get("TASK") == "cp0107_cp0041_worklist_disposition_patch_audit" and not delta_summary_path.is_file():
              raise SystemExit("Missing 450-row worklist disposition delta summary; refusing repository write")
          if delta_summary_path.is_file():
              delta_summary = json.loads(delta_summary_path.read_text(encoding="utf-8"))
              if delta_summary.get("status") != "PASS_450_ROW_DISPOSITION_DELTA_READY":
                  raise SystemExit("450-row disposition delta audit status not PASS")
              if delta_summary.get("checks_passed") != delta_summary.get("checks_total") or any(c.get("status") != "PASS" for c in delta_summary.get("checks", [])):
                  raise SystemExit("Disposition delta audit contains failed checks")
              scope = delta_summary.get("scope", {})
              if scope.get("delta_rows") != 450 or scope.get("proposed_quarantine_dispositions") != 450 or scope.get("worklist_rows_left_unchanged") != 546:
                  raise SystemExit("Disposition delta row scope mismatch")
              delta_source_manifest = delta_summary.get("source_worklist", {})
              if delta_source_manifest.get("rows") != 996 or delta_source_manifest.get("sha256") != "f69229b7bb49a539bae6a8b878447b569c9450760998bfa33a50af9ef6f6ce0f":
                  raise SystemExit("Frozen CP-0041 996-row source worklist reference mismatch")
              decision = delta_summary.get("semantics", {})
              if decision.get("original_996_row_worklist_modified") is not False or decision.get("other_546_rows_modified") is not False or decision.get("source_authority") != "NONE" or decision.get("canonical_source_selected") is not False or decision.get("source_cases_closed") != 0:
                  raise SystemExit("Disposition delta attempts to change source authority or untouched rows")
              outputs = delta_summary.get("outputs", {})
              for name, expected_rows in (("CP0107_CP0041_Worklist_Disposition_Delta_450.csv", 450),):
                  p = folder / name
                  rec = outputs.get(name, {})
                  if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest() != rec.get("sha256") or p.stat().st_size != rec.get("bytes"):
                      raise SystemExit("Disposition delta file hash/size mismatch: " + name)
                  if len(rows(name)) != expected_rows or rec.get("rows") != expected_rows:
                      raise SystemExit("Disposition delta row-count mismatch: " + name)
                  delta_rows = rows(name)
                  if any(x.get("proposed_worklist_disposition") != "QUARANTINE_REVIEW_REQUIRED" or x.get("canonical_source") != "NONE" or x.get("case_closed") != "False" for x in delta_rows):
                      raise SystemExit("Disposition delta has a non-quarantine/closure/source-selection row")
              report = folder / "CP0107_CP0041_Worklist_Disposition_Delta_Report_HI.md"
              rec = outputs.get(report.name, {})

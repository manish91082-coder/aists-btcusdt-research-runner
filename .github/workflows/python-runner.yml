          if not all(p.is_file() for p in (summary_path, manifest_path, blockers_path, report_path)):
              raise SystemExit("Missing quarantine manifest output; refusing repository write")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if summary.get("status") != "PASS_ROW_LEVEL_MANIFEST_NONROW_BLOCKERS_REMAIN":
              raise SystemExit("Manifest status is not the expected bounded PASS; refusing repository write")
          if summary.get("checks_passed") != summary.get("checks_total") or any(c.get("status") != "PASS" for c in summary.get("checks", [])):
              raise SystemExit("Manifest checks contain failures")
          expected = {
              manifest_path.name: (summary["row_level_manifest"]["rows"], summary["row_level_manifest"]["sha256"]),
              blockers_path.name: (summary["nonrow_blockers"]["rows"], summary["nonrow_blockers"]["sha256"]),
          }
          for p in (manifest_path, blockers_path):
              rows = list(csv.DictReader(p.open("r", encoding="utf-8", newline="")))
              n, digest = expected[p.name]
              if len(rows) != n or hashlib.sha256(p.read_bytes()).hexdigest() != digest:
                  raise SystemExit("Output row-count/SHA mismatch: " + p.name)
          manifest = list(csv.DictReader(manifest_path.open("r", encoding="utf-8", newline="")))
          keys = {(r["interval"], r["open_time_ms"]) for r in manifest}
          if len(keys) != summary["row_level_manifest"]["unique_exact_keys"] or len(keys) != len(manifest) or any(r["canonical_source"] != "NONE" or r["case_closed"].lower() != "false" for r in manifest):
              raise SystemExit("Exact-key uniqueness or open/no-canonical-source assertion failed")
          if summary.get("nonrow_blockers", {}).get("candidate_eligibility_blocked") is not True:
              raise SystemExit("Non-row blocker gate missing; refusing repository write")
          print(json.dumps({"status":"PASS_PUBLISH_PREFLIGHT","manifest_rows":len(manifest),"unique_keys":len(keys),"nonrow_blockers":len(list(csv.DictReader(blockers_path.open("r", encoding="utf-8", newline=""))) )},sort_keys=True))
          PY

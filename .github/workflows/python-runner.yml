          cp "$SRC/CP0040_ExactKey_Quarantine_Manifest_Summary.json" "$DEST/CP0040_ExactKey_Quarantine_Manifest_Summary.json"
          cp "$SRC/CP0040_ExactKey_Quarantine_Manifest_Report_HI.md" "$DEST/CP0040_ExactKey_Quarantine_Manifest_Report_HI.md"
          python - <<'PY'

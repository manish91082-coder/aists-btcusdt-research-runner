              note += "- The 450 off-grid rows are a subset of the 909 unmatched rows and were not double-counted. Shared-52 plus close-time-only 8 cover the 60 shared conflict records.\n"
              note += "- Separate non-row blockers: " + str(summary["nonrow_blockers"]["rows"]) + "; counts=" + json.dumps(summary["nonrow_blockers"]["record_type_counts"], sort_keys=True) + ". Candidate eligibility remains BLOCKED.\n"
              note += "- Manifest SHA-256 " + summary["row_level_manifest"]["sha256"] + "; blocker ledger SHA-256 " + summary["nonrow_blockers"]["sha256"] + ". The published frozen index was re-hashed; the original CP-0041 package/rulebook bytes were not freshly re-hashed in this run.\n"
              if "acquisition_extension" in summary:
                  ext = summary["acquisition_extension"]
                  note += "- Acquisition extension reviewed " + str(ext["raw_comparison_rows"]) + " raw row pairs: " + str(ext["raw_divergent_pairs"]) + " divergent pairs, " + str(ext["economic_field_divergent_pairs"]) + " economic-field divergences, and " + str(ext["monthly_only_keys"]) + " monthly-only keys. Newly added unique keys=" + str(summary["row_level_manifest"]["new_unique_keys_added_from_acquisition"]) + "; overlapping keys enriched=" + str(summary["row_level_manifest"]["existing_keys_enriched_with_acquisition_evidence"]) + ". No new downloads.\n"

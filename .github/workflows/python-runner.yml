          run_commit=os.environ["RUN_COMMIT"]
          base=Path("evidence/source_adjudication")
          dest=base / ("CP0040_Reconstruction_Run_" + run_id)
          summary_path=dest / "CP0040_Baseline_Reconstruction_Audit_Summary.json"
          summary=json.loads(summary_path.read_text(encoding="utf-8"))
          outputs={}
          for p in sorted(dest.iterdir()):
              if p.is_file():
                  outputs[p.name]={"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          pointer={
              "run_id":int(run_id),
              "run_commit_sha":run_commit,
              "status":summary["status"],
              "summary_path":str(dest/"CP0040_Baseline_Reconstruction_Audit_Summary.json"),
              "report_path":str(dest/"CP0040_Baseline_Reconstruction_Audit_Report_HI.md"),

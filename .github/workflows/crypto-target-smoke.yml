name: Crypto target research smoke tests

on:
  push:
    branches: [main]
    paths:
      - "crypto_target/**"
      - "tests_crypto_target/**"
      - ".github/workflows/crypto-target-smoke.yml"
  pull_request:
    paths:
      - "crypto_target/**"
      - "tests_crypto_target/**"
      - ".github/workflows/crypto-target-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research helpers
        run: python -m py_compile crypto_target/research_math.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests_crypto_target -v

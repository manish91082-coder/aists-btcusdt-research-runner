name: Crypto target research smoke tests

on:
  push:
    branches: [main]
    paths:
      - "crypto_target/**"
      - "tests_crypto_target/**"
      - "tests_crypto_target/test_execution_receipt.py"
      - "scripts/cleanup_current_project.py"
      - "scripts/write_execution_receipt.py"
      - "scripts/acquire_validate_hd03.py"
      - "scripts/build_hd04_universe_snapshot.py"
      - "scripts/probe_hd04_archive_sources.py"
      - "scripts/probe_hd04_alternate_sources.py"
      - "scripts/backtest_btcusdt_candidate_baselines.py"
      - "tests_crypto_target/test_btcusdt_candidate_baselines.py"
      - "scripts/acquire_validate_btcusdt_history.py"
      - "scripts/prepare_btcusdt_research_dataset.py"
      - "scripts/backtest_btcusdt_baseline.py"
      - "scripts/backtest_btcusdt_candidate_baselines.py"
      - "scripts/collect_btcusdt_full_history.py"
      - "scripts/upload_btcusdt_history_to_supabase.py"
      - "scripts/probe_btcusdt_archive_coverage.py"
      - "tests_crypto_target/test_btcusdt_archive_coverage.py"
      - ".github/workflows/btcusdt-archive-coverage-inventory.yml"
      - "docs/supabase_btcusdt_history_schema.sql"
      - ".github/workflows/btcusdt-full-history-collection.yml"
      - ".github/workflows/btcusdt-supabase-upload-canary.yml"
      - ".github/workflows/btcusdt-multimonth-history-integrity.yml"
      - "CURRENT_PROJECT_KEEP_PATHS.txt"
      - ".github/workflows/crypto-target-smoke.yml"
  pull_request:
    paths:
      - "crypto_target/**"
      - "tests_crypto_target/**"
      - "scripts/cleanup_current_project.py"
      - "CURRENT_PROJECT_KEEP_PATHS.txt"
      - "scripts/probe_hd04_alternate_sources.py"
      - "scripts/acquire_validate_btcusdt_history.py"
      - "scripts/collect_btcusdt_full_history.py"
      - ".github/workflows/btcusdt-full-history-collection.yml"
      - ".github/workflows/btcusdt-supabase-upload-canary.yml"
      - ".github/workflows/btcusdt-multimonth-history-integrity.yml"
      - ".github/workflows/crypto-target-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research and maintenance helpers
        run: python -m py_compile crypto_target/research_math.py scripts/cleanup_current_project.py scripts/write_execution_receipt.py
      - name: Check required project documents
        run: |
          set -euo pipefail
          for file in \
            README.md \
            CRYPTO_10CR_PROJECT_DETAILS.md \
            CRYPTO_10CR_PROJECT_STATUS.md \
            CRYPTO_10CR_RESEARCH_LOG_HI.md \
            AI_AUTONOMOUS_TRADING_ARCHITECTURE.md \
            END_TO_END_EXECUTION_PLAN_HI.md \
            CURRENT_PROJECT_KEEP_PATHS.txt; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          grep -q "1,061,120.54 USDT" README.md
          grep -q "1,061,120.54 USDT" CRYPTO_10CR_PROJECT_DETAILS.md
          grep -q "1,061,120.54 USDT" CRYPTO_10CR_PROJECT_STATUS.md
          grep -q "1,061,120.54 USDT" CRYPTO_10CR_RESEARCH_LOG_HI.md
          grep -q "1,061,120.54 USDT" AI_AUTONOMOUS_TRADING_ARCHITECTURE.md
          grep -q "1,061,120.54 USDT" END_TO_END_EXECUTION_PLAN_HI.md
          grep -q "HD-03" END_TO_END_EXECUTION_PLAN_HI.md
          grep -q "END_TO_END_EXECUTION_PLAN_HI.md" README.md
          grep -q "NOT ESTABLISHED" CRYPTO_10CR_PROJECT_STATUS.md
          grep -q "UNKNOWN" CRYPTO_10CR_PROJECT_STATUS.md
          if grep -Eiq "expanded.*(currently )?pending" README.md CRYPTO_10CR_PROJECT_DETAILS.md CRYPTO_10CR_PROJECT_STATUS.md; then
            echo "A core project document still labels the expanded CI result as pending."
            exit 1
          fi
          grep -Eq "actions/runs/[0-9]+" README.md
          grep -Eq "actions/runs/[0-9]+" CRYPTO_10CR_PROJECT_DETAILS.md
          grep -Eq "actions/runs/[0-9]+" CRYPTO_10CR_PROJECT_STATUS.md
      - name: Verify repository has no files outside the committed keep-list
        run: |
          set -euo pipefail
          python scripts/cleanup_current_project.py | tee cleanup-preview.txt
          grep -Fq "Tracked files to stage for deletion: 0" cleanup-preview.txt
      - name: Compile HD-03 validator
        run: python -m py_compile scripts/acquire_validate_hd03.py
      - name: Compile HD-03 and HD-04 tools
        run: python -m py_compile scripts/acquire_validate_hd03.py scripts/build_hd04_universe_snapshot.py scripts/probe_hd04_archive_sources.py scripts/probe_hd04_alternate_sources.py scripts/acquire_validate_btcusdt_history.py scripts/prepare_btcusdt_research_dataset.py scripts/backtest_btcusdt_baseline.py scripts/backtest_btcusdt_candidate_baselines.py scripts/collect_btcusdt_full_history.py scripts/upload_btcusdt_history_to_supabase.py scripts/probe_btcusdt_archive_coverage.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests_crypto_target -v
      - name: Write execution receipt even when checks fail
        if: always()
        env:
          RECEIPT_STATUS: ${{ job.status }}
          RECEIPT_NOTES: "Smoke CI receipt; consult preceding step logs for exact failure details."
        run: |
          python -u scripts/write_execution_receipt.py --output-dir artifacts/execution-receipt
          cat artifacts/execution-receipt/execution-receipt.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload execution receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/execution-receipt/
          if-no-files-found: error
          retention-days: 30
